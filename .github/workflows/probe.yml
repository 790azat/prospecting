name: maps-probe
on:
  push:
    branches: [maps-probe]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe.py
      - run: |
          git config user.name "prospecting-bot"; git config user.email "actions@users.noreply.github.com"
          git add probe/out; git commit -m "probe out [skip ci]"; git push
