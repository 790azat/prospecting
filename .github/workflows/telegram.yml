name: telegram-outreach

on:
  # 2026-10-11 Азат выбрал автозапуск: пн-сб в 11:00 по Еревану, +1 человек в день до 10. Перед отправкой проверка @SpamBot.
  # GitHub сильно задерживает cron, поэтому несколько запасных запусков: лишние только слушают ответы.
  schedule:
    - cron: "0 6 * * 1-6"
    - cron: "0 7 * * 1-6"
    - cron: "30 8 * * 1-6"
    - cron: "0 10 * * 1-6"
    - cron: "0 12 * * 1-6"
  workflow_dispatch:
    inputs:
      mode:
        description: "send_code / sign_in / run / day / listen / inbox / say / status"
        default: status
      code:
        description: "Код входа из Telegram (для sign_in)"
        default: ""
      to:
        description: "say: tg_id получателя"
        default: ""
      text:
        description: "say: текст ответа"
        default: ""
      limit:
        description: "Максимум сообщений в этот запуск (пусто = дневной лимит)"
        default: ""

permissions:
  contents: write

concurrency:
  group: telegram-outreach
  cancel-in-progress: false

jobs:
  tg:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_2FA: ${{ secrets.TG_2FA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q telethon==1.* cryptography hachoir playwright && python -m playwright install --with-deps chromium > /dev/null
      - name: Check secrets
        run: |
          [ -n "$TG_API_ID" ] && [ -n "$TG_API_HASH" ] || { echo "::error::Добавьте секреты TG_API_ID и TG_API_HASH"; exit 1; }
      - name: Telegram
        env:
          MODE: ${{ github.event.inputs.mode || 'day' }}
          TG_TO: ${{ github.event.inputs.to }}
          TG_TEXT: ${{ github.event.inputs.text }}
          CODE: ${{ github.event.inputs.code }}
          TG_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          [ -n "$CODE" ] && echo "::add-mask::$CODE"
          case "$MODE" in
            sign_in) python scripts/tg_outreach.py sign_in "$CODE" ;;
            send_code|run|day|listen|inbox|say|followup|status) python scripts/tg_outreach.py "$MODE" ;;
            *) echo "unknown mode $MODE"; exit 1 ;;
          esac
      - name: Save state
        if: always()
        run: |
          git config user.name "prospecting-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tg
          git diff --cached --quiet && exit 0
          git commit -m "tg: $(date -u +%F) ${{ github.event.inputs.mode || 'day' }}"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
