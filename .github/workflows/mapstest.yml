name: maps-test
on:
  push:
    branches: [maps-probe]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: MAPS_NICHES=стоматология MAPS_TOP_PAGES=3 MAPS_STEP=0.06 MAPS_OUT=out/y.csv python3 scripts/maps_yandex.py && wc -l out/y.csv && head -5 out/y.csv
      - run: pip install playwright && python3 -m playwright install --with-deps chromium && MAPS_NICHES=dentist MAPS_AREAS=Kentron MAPS_OUT=out/g.csv python3 scripts/maps_google.py && wc -l out/g.csv && head -8 out/g.csv
