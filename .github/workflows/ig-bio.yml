name: ig-bio

# Телефоны и ссылки из bio Instagram-магазинов (data/magaziny).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/ig-bio.yml", "scripts/ig_bio.py", "data/magaziny/instagram.csv", "data/magaziny/ig_more.txt"]

permissions:
  contents: write

concurrency: ig-bio

jobs:
  bio:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/ig_bio.py
        env:
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/magaziny/ig_bio.csv data/magaziny/ig_related.txt
          git commit -m "ig-bio: телефоны из bio" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
