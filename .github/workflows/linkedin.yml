name: linkedin-leads

on:
  push:
    branches: [main]
    paths: ["data/linkedin/companies.csv"]
  schedule:
    - cron: "0 4 * * 1"   # по понедельникам перепроверяем сайты
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit LinkedIn companies' websites
        run: python3 scripts/linkedin_leads.py
      - name: Commit results
        run: |
          git config user.name "prospecting-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "linkedin: $(date -u +%F)"
          git pull --rebase origin main
          git push
