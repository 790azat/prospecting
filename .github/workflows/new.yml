name: new-businesses

on:
  push:
    branches: [main]
    paths: ["scripts/new_osm.py", ".github/workflows/new.yml"]
  schedule:
    - cron: "0 3 * * 1"   # по понедельникам
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: New businesses from OpenStreetMap
        run: python3 scripts/new_osm.py
      - name: Commit results
        run: |
          git config user.name "prospecting-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/new
          git diff --cached --quiet || git commit -m "data: new businesses $(date -u +%F)"
          git pull --rebase
          git push
