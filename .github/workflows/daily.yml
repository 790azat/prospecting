name: daily-prospecting

on:
  schedule:
    - cron: "0 4 * * *"   # 08:00 по Еревану
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect businesses from OpenStreetMap
        run: python3 scripts/collect_osm.py
      - name: Audit websites and build leads
        run: python3 scripts/build_leads.py
      - name: Commit results
        run: |
          git config user.name "prospecting-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
